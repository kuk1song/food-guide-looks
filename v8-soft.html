<!doctype html>
<!--
  V8 "Soft": a friendly, tactile consumer app.
  Fonts: Fredoka (variable, latin subset), by Milena Brandão and Hafontia, SIL Open Font License 1.1;
         Nunito (variable, latin subset), by Vernon Adams, Cyreal and Jacques Le Bailly, SIL Open Font License 1.1.
  Both self-hosted from fonts/ (Fontsource @fontsource-variable/fredoka and /nunito 5.2.7). Chinese uses the system stack.
  Sticker illustrations are hand-written inline SVG. No network requests at runtime.
-->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#FFF4E6">
<title>Soft · China Food Guide</title>
<style>
@font-face { font-family: "Fredoka"; src: url("fonts/fredoka-latin-standard-normal.woff2") format("woff2"); font-weight: 300 700; font-stretch: 75% 125%; font-display: swap; }
@font-face { font-family: "Nunito"; src: url("fonts/nunito-latin-wght-normal.woff2") format("woff2"); font-weight: 200 1000; font-display: swap; }
:root {
  --cream: #FFF4E6; --ink: #2B1A12; --ink2: #5C4636; --white: #FFFFFF;
  --peach: #FFBE9C; --butter: #FFD970; --mint: #9FE0BF; --rose: #F7B5C0; --lilac: #D3C2F5; --sky: #B9DDF7;
  --warn-ink: #9B1C10; --warn-edge: #C62D1F; --warn-bg: #FFFFFF;
  --pop: cubic-bezier(.34, 1.56, .64, 1);
  --zh: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
  --safe-b: env(safe-area-inset-bottom, 0px);
  --safe-t: env(safe-area-inset-top, 0px);
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html { -webkit-text-size-adjust: 100%; }
body { margin: 0; background: #F3E3CF; color: var(--ink); font-family: "Nunito", system-ui, sans-serif; font-size: 17px; line-height: 1.5; font-weight: 550; -webkit-font-smoothing: antialiased; -webkit-tap-highlight-color: transparent; }
.zh, [lang="zh-Hans"] { font-family: var(--zh); }
a { color: inherit; }
button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; }
:focus-visible { outline: 3px solid var(--ink); outline-offset: 3px; }
.f { font-family: "Fredoka", "Nunito", system-ui, sans-serif; }
.app { max-width: 430px; margin: 0 auto; min-height: 100vh; background: var(--cream); padding: 0 0 calc(28px + var(--safe-b)); overflow-x: hidden; }
.press { transition: transform .22s var(--pop); }
.press:active { transform: scale(.95); }

/* header */
.hd { display: flex; align-items: center; gap: 10px; padding: calc(12px + var(--safe-t)) 16px 6px; }
.wm { display: flex; align-items: center; gap: 8px; text-decoration: none; flex: 1; min-width: 0; min-height: 48px; }
.wm .st { width: 46px; height: 40px; transform: rotate(-8deg); flex: none; }
.wm b { font-family: "Fredoka", sans-serif; font-weight: 650; font-stretch: 108%; font-size: 23px; line-height: 1; letter-spacing: -.01em; }
.tag { flex: none; font-family: "Fredoka", sans-serif; font-weight: 600; font-size: 14px; line-height: 1.15; text-align: center; background: var(--white); border: 2.5px solid var(--ink); border-radius: 12px; padding: 4px 8px; transform: rotate(3deg); }
.back { width: 48px; height: 48px; border-radius: 50%; border: 3px solid var(--ink); display: grid; place-items: center; background: var(--white); flex: none; }
.back svg { width: 22px; height: 22px; }
.hello { padding: 4px 16px 12px; margin: 0; font-family: "Fredoka", sans-serif; font-weight: 500; font-size: 30px; line-height: 1.1; letter-spacing: -.01em; }

/* tiles */
.grid { display: grid; grid-template-columns: 1.12fr .88fr; grid-auto-flow: row dense; gap: 12px; padding: 0 16px; }
.tile { position: relative; border-radius: 30px; padding: 16px; text-decoration: none; display: block; animation: pop .4s var(--pop) both; animation-delay: var(--d, 0s); overflow: hidden; }
@keyframes pop { from { transform: scale(.94) translateY(8px); opacity: 0; } to { transform: none; opacity: 1; } }
.wide { grid-column: 1 / -1; }
.tall { grid-row: span 2; }
.t-tell { background: var(--peach); border-radius: 34px 34px 34px 12px; padding: 14px 16px 10px; }
.t-tell h2 { margin: 0 0 10px; font-family: "Fredoka", sans-serif; font-weight: 600; font-size: 22px; line-height: 1.15; }
.say { width: 100%; min-height: 112px; resize: none; border: 3px solid var(--ink); border-radius: 22px; background: var(--white); padding: 12px 14px; font: 600 18px/1.4 "Nunito", system-ui, sans-serif; color: var(--ink); }
.say:focus { outline: none; box-shadow: 0 0 0 4px var(--butter); }
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 54px; padding: 0 22px; border-radius: 99px; font-family: "Fredoka", sans-serif; font-weight: 600; font-size: 19px; text-decoration: none; text-align: center; line-height: 1.1; }
.btn.ink { background: var(--ink); color: var(--butter); }
.btn.out { background: var(--white); border: 3px solid var(--ink); }
.btn.full { width: 100%; }
.btn svg { width: 22px; height: 22px; }
.demo { margin: 8px 2px 0; font-size: 15px; font-weight: 650; color: var(--ink2); }
.t-tell .demo { color: #4A2E1E; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { display: inline-flex; align-items: center; gap: 6px; min-height: 44px; padding: 0 6px 0 13px; border-radius: 99px; background: var(--white); border: 2.5px solid var(--ink); font-family: "Fredoka", sans-serif; font-weight: 600; font-size: 16px; transition: transform .22s var(--pop), opacity .15s; }
.chip .x { width: 26px; height: 26px; border-radius: 50%; background: var(--ink); color: var(--white); display: grid; place-items: center; }
.chip .x svg { width: 14px; height: 14px; }
.chip.add { background: var(--ink); color: var(--butter); padding: 0 16px; }
.chip.bye { transform: scale(0); opacity: 0; }
.chip[aria-pressed="false"] { background: transparent; border-style: dashed; }
.chip[aria-pressed="true"] { background: var(--butter); }
.linkish { font-weight: 800; text-decoration: underline; text-decoration-thickness: 2px; text-underline-offset: 3px; min-height: 44px; display: inline-flex; align-items: center; }
.picker { margin: 12px 0 0; background: var(--white); border: 3px solid var(--ink); border-radius: 24px; padding: 10px 12px 12px; }
.picker h3 { margin: 6px 0 6px; font-family: "Fredoka", sans-serif; font-weight: 600; font-size: 16px; }

.t-best { background: var(--c); min-height: 250px; border-radius: 34px 12px 34px 34px; padding: 18px 18px 18px; }
.t-best .st { position: absolute; right: -2px; top: 66px; width: 136px; height: 112px; transform: rotate(8deg); }
.badge { display: inline-block; font-family: "Fredoka", sans-serif; font-weight: 600; font-size: 15px; background: var(--ink); color: var(--white); border-radius: 99px; padding: 4px 12px; }
.t-best h3 { margin: 12px 0 2px; max-width: 62%; font-family: "Fredoka", sans-serif; font-weight: 650; font-size: 31px; line-height: 1.02; letter-spacing: -.01em; }
.t-best .zh { display: block; font-size: 16px; font-weight: 600; max-width: 64%; }
.t-best .sub { margin: 4px 0 0; font-weight: 700; font-size: 16px; max-width: 64%; }
.fits { display: flex; flex-wrap: wrap; gap: 6px; margin: 12px 0 0; padding: 0; list-style: none; }
.fits li { display: inline-flex; align-items: center; gap: 4px; font-weight: 800; font-size: 15px; background: var(--white); border-radius: 99px; padding: 3px 11px 3px 6px; }
.fits li svg { width: 18px; height: 18px; }
.fits li.u { background: transparent; border: 2px dashed var(--ink); }
.miss { margin: 6px 0 0; font-size: 16px; font-weight: 700; color: var(--ink2); }
.dline { display: flex; gap: 8px; align-items: flex-start; margin: 10px 0 0; font-size: 16px; line-height: 1.4; font-weight: 650; background: rgba(255,255,255,.72); border-radius: 18px; padding: 8px 12px; }
.dline svg { width: 22px; height: 22px; flex: none; margin-top: 1px; }
.dline.clash, .warn { background: var(--warn-bg); color: var(--warn-ink); border: 3px dashed var(--warn-edge); }
.go-arrow { position: absolute; right: 14px; top: 14px; width: 46px; height: 46px; border-radius: 50%; background: var(--ink); color: var(--butter); display: grid; place-items: center; }
.go-arrow svg { width: 22px; height: 22px; }
.t-best .dline { margin-right: 0; }

.t-mid { grid-column: 1; background: var(--c); padding: 14px 14px 16px; border-radius: 26px; }
.t-mid .st { width: 88px; height: 74px; display: block; margin: -4px 0 4px -4px; transform: rotate(var(--rot, -6deg)); }
.t-mid h3 { margin: 0; font-family: "Fredoka", sans-serif; font-weight: 600; font-size: 21px; line-height: 1.05; }
.t-mid .zh { display: block; font-size: 16px; font-weight: 600; margin-top: 2px; }
.t-mid .fits li { font-size: 14px; }

.t-card { grid-column: 2; grid-row: span 2; background: var(--lilac); border-radius: 26px 26px 40px 26px; display: flex; flex-direction: column; }
.t-card h3, .t-rest h3, .t-dish h3, .sheet6 h3 { margin: 0; font-family: "Fredoka", sans-serif; font-weight: 600; font-size: 20px; line-height: 1.1; }
.t-card .preview { display: flex; flex-direction: column; gap: 6px; background: var(--white); border: 3px solid var(--ink); border-radius: 20px; margin: 10px 0 12px; padding: 12px 10px; transform: rotate(-2deg); }
.t-card .preview .zh { font-size: 23px; font-weight: 700; line-height: 1.3; }
.t-card .preview .zs { font-size: 15px; font-weight: 600; line-height: 1.35; }
.t-card .preview .zo { font-size: 19px; font-weight: 700; background: var(--butter); border-radius: 10px; padding: 2px 8px; }
.t-card .btn { margin-top: auto; }
.t-card .preview small { display: block; font-size: 14px; font-weight: 700; color: var(--ink2); margin-top: 4px; }
.t-card .btn { min-height: 48px; font-size: 17px; padding: 0 14px; }

.t-rest { background: var(--white); border: 3px solid var(--ink); border-radius: 26px; padding: 14px 12px; }
.t-rest ul { list-style: none; margin: 8px 0 0; padding: 0; }
.t-rest a { display: flex; align-items: center; gap: 8px; min-height: 52px; text-decoration: none; font-family: "Fredoka", sans-serif; font-weight: 600; font-size: 17px; line-height: 1.1; border-radius: 16px; padding: 2px 4px; }
.t-rest a:active { background: var(--cream); }
.t-rest .st { width: 46px; height: 40px; flex: none; }
.t-rest p { margin: 4px 0 0; font-size: 15px; color: var(--ink2); font-weight: 650; }
.t-dish { background: var(--butter); border-radius: 26px 26px 26px 10px; display: flex; align-items: center; gap: 12px; }
.t-dish .st { width: 86px; height: 72px; flex: none; transform: rotate(6deg); }
.t-dish p { margin: 4px 0 0; font-size: 16px; font-weight: 700; }
.sheet6 { background: var(--white); border: 3px solid var(--ink); }
.sheet6 ul { list-style: none; margin: 10px 0 0; padding: 0; display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.sheet6 a { display: flex; flex-direction: column; align-items: center; text-align: center; gap: 2px; text-decoration: none; font-family: "Fredoka", sans-serif; font-weight: 600; font-size: 15px; line-height: 1.1; padding: 8px 2px; border-radius: 20px; background: var(--c); min-height: 112px; }
.sheet6 .st { width: 72px; height: 60px; transform: rotate(var(--rot)); }
.foot { margin: 18px 16px 0; font-size: 16px; color: var(--ink2); font-weight: 650; }

/* stickers: a white die-cut edge, then flat fills with a thick ink outline */
.st { overflow: visible; }
.st .edge * { fill: #fff !important; stroke: #fff !important; stroke-width: 13px; stroke-linejoin: round; stroke-linecap: round; }
.st .art * { stroke: var(--ink); stroke-width: 4.5px; stroke-linejoin: round; stroke-linecap: round; }
.st .art .nos { stroke: none; }

/* restaurant */
.hero { margin: 4px 16px 0; background: var(--c); border-radius: 36px 36px 36px 14px; padding: 18px 18px 20px; position: relative; overflow: hidden; }
.hero .st { display: block; width: 210px; height: 175px; margin: -4px auto 4px; transform: rotate(-5deg); }
.hero h1 { margin: 0; font-family: "Fredoka", sans-serif; font-weight: 650; font-size: 32px; line-height: 1.02; letter-spacing: -.012em; }
.hero .sub { margin: 4px 0 0; font-weight: 750; }
.hero .zh { display: block; font-size: 20px; font-weight: 600; margin-top: 4px; }
.pills { display: flex; flex-wrap: wrap; gap: 6px; margin: 10px 0 0; }
.pill { display: inline-flex; align-items: center; min-height: 32px; font-weight: 800; font-size: 15px; background: var(--white); border-radius: 99px; padding: 3px 12px; }
.pill.u { background: transparent; border: 2px dashed var(--ink); }
.body { padding: 0 16px; }
.why { font-family: "Fredoka", sans-serif; font-weight: 500; font-size: 22px; line-height: 1.25; margin: 18px 0 0; }
.acts { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin: 16px 0 0; }
.acts .btn { padding: 0 10px; font-size: 18px; min-height: 58px; }
.acts .btn[aria-disabled="true"] { opacity: .65; }
.ticket {
  display: block; width: 100%; text-align: left; margin: 18px 0 0; background: var(--white); border: 3px solid var(--ink); border-radius: 26px; padding: 14px 16px 16px; position: relative;
}
.ticket::before, .ticket::after { content: ""; position: absolute; top: 58px; width: 22px; height: 22px; border-radius: 50%; background: var(--cream); border: 3px solid var(--ink); }
.ticket::before { left: -13px; clip-path: inset(0 0 0 50%); }
.ticket::after { right: -13px; clip-path: inset(0 50% 0 0); }
.ticket .top { display: flex; align-items: center; gap: 8px; font-family: "Fredoka", sans-serif; font-weight: 600; font-size: 18px; padding-bottom: 12px; border-bottom: 3px dashed var(--ink); }
.ticket .top .st { width: 50px; height: 40px; }
.ticket .top span { flex: 1; }
.ticket .zh { display: block; font-size: 28px; font-weight: 700; line-height: 1.3; margin: 12px 0 4px; }
.ticket .en { font-size: 16px; font-weight: 700; color: var(--ink2); }
.note { font-size: 16px; color: var(--ink2); margin: 8px 4px 0; font-weight: 650; }
.blob { margin: 16px 0 0; border-radius: 28px; padding: 14px 16px 16px; }
.blob h2 { margin: 0 0 4px; font-family: "Fredoka", sans-serif; font-weight: 600; font-size: 20px; }
.blob p { margin: 0; }
.blob.a { background: var(--mint); border-radius: 28px 28px 28px 8px; }
.blob.b { background: var(--butter); border-radius: 28px 8px 28px 28px; }
.blob.c { background: var(--white); border: 3px solid var(--ink); }
.dishes { list-style: none; margin: 6px 0 0; padding: 0; display: grid; gap: 8px; }
.dish { display: flex; align-items: center; gap: 10px; background: var(--cream); border-radius: 20px; padding: 8px 12px; min-height: 56px; text-decoration: none; }
.dish .nm { flex: 1; }
.dish .zh { display: block; font-size: 19px; font-weight: 700; }
.dish .en { font-size: 16px; font-weight: 700; }
.dish .b2 { flex: none; font-family: "Fredoka", sans-serif; font-weight: 600; font-size: 14px; background: var(--ink); color: var(--white); border-radius: 99px; padding: 3px 10px; white-space: nowrap; }
.dish .b1 { flex: none; font-family: "Fredoka", sans-serif; font-weight: 600; font-size: 14px; border: 2px dashed var(--ink); border-radius: 99px; padding: 2px 10px; white-space: nowrap; }
.dish.single { background: transparent; border: 2px dashed #9C8574; }
.ask-link { font-family: "Fredoka", sans-serif; font-weight: 600; font-size: 15px; text-decoration: underline; text-decoration-thickness: 2px; text-underline-offset: 3px; display: inline-flex; min-height: 44px; align-items: center; }
.srcs { font-size: 16px; color: var(--ink2); margin: 14px 4px 0; font-weight: 650; }

/* order */
.h1 { margin: 6px 16px 0; font-family: "Fredoka", sans-serif; font-weight: 600; font-size: 30px; line-height: 1.08; }
.minir { display: flex; align-items: center; gap: 8px; margin: 10px 16px 0; background: var(--c); border-radius: 22px; padding: 8px 14px 8px 8px; }
.minir .st { width: 64px; height: 54px; flex: none; }
.minir b { display: block; font-family: "Fredoka", sans-serif; font-weight: 600; font-size: 19px; line-height: 1.05; }
.q { margin: 20px 16px 8px; font-family: "Fredoka", sans-serif; font-weight: 600; font-size: 21px; }
.pebbles { display: flex; gap: 8px; padding: 0 16px; flex-wrap: wrap; }
.pebbles a { width: 52px; height: 52px; border-radius: 50% 50% 46% 54%; border: 3px solid var(--ink); background: var(--white); display: grid; place-items: center; text-decoration: none; font-family: "Fredoka", sans-serif; font-weight: 600; font-size: 22px; transition: transform .25s var(--pop); }
.pebbles a[aria-current="true"] { background: var(--ink); color: var(--butter); transform: scale(1.08) rotate(-6deg); }
.needs { display: flex; flex-wrap: wrap; gap: 8px; padding: 0 16px; }
.need { display: inline-flex; align-items: center; gap: 8px; min-height: 52px; padding: 0 16px 0 10px; border-radius: 99px; border: 3px solid var(--ink); background: var(--white); text-decoration: none; font-family: "Fredoka", sans-serif; font-weight: 600; font-size: 18px; transition: transform .25s var(--pop); }
.need .bx { width: 28px; height: 28px; border-radius: 50%; border: 3px solid var(--ink); display: grid; place-items: center; }
.need .bx svg { width: 16px; height: 16px; }
.need[aria-pressed="true"] { background: var(--butter); }
.need[aria-pressed="true"] .bx { background: var(--ink); color: var(--butter); }
.tray { margin: 16px 16px 0; background: var(--white); border: 3px solid var(--ink); border-radius: 30px; padding: 6px 14px 14px; }
.tray h2 { margin: 10px 0 6px; font-family: "Fredoka", sans-serif; font-weight: 600; font-size: 20px; }
.olist { list-style: none; margin: 0; padding: 0; display: grid; gap: 10px; }
.olist li { display: grid; grid-template-columns: 58px 1fr; gap: 10px; align-items: start; background: var(--cream); border-radius: 22px; padding: 10px 12px 12px 8px; animation: pop .35s var(--pop) both; }
.olist .st { width: 58px; height: 48px; }
.olist .dotz { width: 46px; height: 46px; margin: 2px 6px; border-radius: 50%; border: 3px solid var(--ink); background: var(--rose); }
.olist .zh { font-size: 25px; font-weight: 700; }
.olist .qz { font-size: 21px; font-weight: 700; margin-left: 6px; }
.olist .en { display: block; font-weight: 800; }
.olist p { margin: 4px 0 0; font-size: 16px; font-weight: 650; color: var(--ink2); }
.olist .warn { color: var(--warn-ink); margin-top: 8px; padding: 6px 10px; font-size: 15px; display: flex; gap: 6px; border-radius: 14px; }
.olist .warn svg { width: 20px; height: 20px; flex: none; }
.sub-h { font-family: "Fredoka", sans-serif; font-weight: 600; font-size: 17px; margin: 14px 0 6px; }
.outl { list-style: none; margin: 0; padding: 0; display: grid; gap: 6px; }
.cta { margin: 18px 16px 0; }

/* card */
.cardv { max-width: 430px; margin: 0 auto; min-height: 100vh; background: var(--cream); padding: calc(6px + var(--safe-t)) 10px calc(20px + var(--safe-b)); }
.ctop { display: flex; align-items: center; gap: 8px; min-height: 52px; }
.ctop .t { flex: 1; font-family: "Fredoka", sans-serif; font-weight: 600; font-size: 16px; line-height: 1.15; }
.ctop .tag { transform: rotate(2deg); font-size: 13px; }
.paper { background: var(--white); color: #1A1009; border: 3px solid var(--ink); border-radius: 28px; padding: 1.4vh 16px 1.4vh; margin-top: 4px; }
.paper .g { font-size: min(22px, 3.2vh); font-weight: 600; margin: 0 0 1vh; }
.paper ul { list-style: none; margin: 0 0 1.2vh; padding: .6vh 12px; background: var(--butter); border-radius: 18px; }
.paper ul li { font-size: min(31px, 4.5vh); font-weight: 800; line-height: 1.3; }
.paper ul li b { margin-left: .4em; }
.paper .st1 { font-size: min(31px, 4.6vh); font-weight: 800; line-height: 1.25; margin: 0 0 1vh; }
.paper .s2 { font-size: min(20px, 3vh); font-weight: 500; line-height: 1.45; margin: 0 0 .7vh; }
.paper .cl { font-size: min(23px, 3.4vh); font-weight: 700; margin: .8vh 0 0; }
.cswitch { display: flex; gap: 6px; margin: 8px 0 0; }
.cswitch a { flex: 1; min-height: 46px; display: grid; place-items: center; border-radius: 99px; border: 3px solid var(--ink); text-decoration: none; font-family: "Fredoka", sans-serif; font-weight: 600; font-size: 16px; background: var(--white); }
.cswitch a[aria-current="true"] { background: var(--ink); color: var(--butter); }
.gloss { margin: 14px 0 0; background: var(--peach); border-radius: 28px; padding: 14px 16px 16px; }
.gloss h2 { margin: 0 0 6px; font-family: "Fredoka", sans-serif; font-weight: 600; font-size: 21px; }
.gloss p, .gloss li { margin: 0 0 8px; font-size: 16px; }
.gloss ol { padding-left: 1.3em; margin: 0 0 8px; }
.gloss .warn { padding: 10px 12px; border-radius: 18px; display: flex; gap: 8px; margin-top: 10px; }
.gloss .warn svg { width: 24px; height: 24px; flex: none; }

/* ask: a short chat over the page */
.ov { position: fixed; inset: 0; z-index: 30; display: flex; align-items: flex-end; justify-content: center; background: rgba(43, 26, 18, .45); animation: fade .2s both; }
@keyframes fade { from { opacity: 0; } }
.chat { width: min(100%, 430px); max-height: 88vh; overflow-y: auto; background: var(--cream); border-radius: 32px 32px 0 0; padding: 14px 16px calc(20px + var(--safe-b)); animation: up .42s var(--pop) both; }
@keyframes up { from { transform: translateY(40%); } }
.chat-h { display: flex; align-items: center; gap: 10px; }
.chat-h .st { width: 74px; height: 62px; flex: none; transform: rotate(-6deg); }
.chat-h h2 { flex: 1; margin: 0; font-family: "Fredoka", sans-serif; font-weight: 600; font-size: 22px; line-height: 1.1; }
.chat-h .zh { display: block; font-size: 17px; font-weight: 600; }
.bubbles { display: flex; flex-direction: column; gap: 8px; margin: 12px 0 0; }

/* ---------- state ---------- */
var first = parseSentence(PREFILL);

/* ---------- home: an uneven grid, tile size follows the job ---------- */
function homeView() {
  var h = header() + (S.submitted ? '' : '<p class="hello">Hungry? Let’s find your table in Beijing.</p>') + '<div class="grid">';

      '<button class="btn ink full press" type="submit" data-act="parse" style="margin-top:10px">Turn it into chips ' + ic('right') + '</button></form>' +
      '<p class="demo">A scripted demo for now: keyword rules read your sentence, no model is connected.</p>';
  } else {
    h += '<h2 id="tell-h">Here’s what I heard from you</h2><div class="chips">' + S.chips.map(function (v) {
      return '<button class="chip press" data-act="rm" data-v="' + v + '" aria-label="Remove ' + esc(OPT[v].label) + '">' + esc(OPT[v].label) + '<span class="x">' + ic('x') + '</span></button>';
    }).join('') + '<button class="chip add press" data-act="pick" aria-expanded="' + S.picking + '">' + ic('plus') + (S.picking ? 'Done' : 'Add') + '</button></div>' +
      (S.picking ? picker() : '') +
      '<p class="demo">Scripted demo, no model connected. <a class="linkish" href="#/" data-act="edit">Change my sentence</a></p>';
  }
  h += '</section>';
  if (!S.submitted) {
    h += '<section class="tile wide sheet6" ' + delay() + '"><h3>Six places to start with</h3><ul>' + P.restaurants.map(function (r) {
      var l = lk(r);
      return '<li><a class="press" href="#/r/' + r.id + '" style="--c:' + l.c + ';--rot:' + l.rot + '">' + sticker(l.art) + esc(splitName(r.nameEn).main.replace(/^Niujie Halal /, '')) + '</a></li>';
    }).join('') + '</ul></section>';
  } else {
    var rk = ranked(S.chips);
    var best = rk[0], mids = rk.slice(1, 3), rest = rk.slice(3);
    var bl = lk(best.r), bn = splitName(best.r.nameEn);
    h += '<a class="tile wide t-best press" href="#/r/' + best.r.id + '" ' + delay() + ';--c:' + bl.c + '">' + sticker(bl.art) +
      '<span class="badge">' + (best.e.full ? 'Your best bet: fits all your chips' : 'Closest to your chips') + '</span>' +
      '<h3>' + esc(bn.main) + '</h3>' + zh(best.r.nameZh) +
      fitsHtml(best.e) + dietHtml(best.e) + '<span class="go-arrow">' + ic('right') + '</span></a>';
    var cardDiet = groups(S.chips).diet.filter(function (v) { return P.cards[v]; });
    h += mids.map(function (x, i) {
      var l = lk(x.r);
      return '<a class="tile t-mid press" href="#/r/' + x.r.id + '" ' + delay() + ';--c:' + l.c + ';--rot:' + l.rot + '">' + sticker(l.art) +
        '<h3>' + esc(splitName(x.r.nameEn).main.replace(/^Niujie Halal /, '')) + '</h3>' + zh(x.r.nameZh) + fitsHtml(x.e) + '</a>';
    }).join('');
    h += '<a class="tile tall t-card press" href="' + cardHash(best.r.id) + '" ' + delay() + '"><h3>Your staff card</h3>' +
      (function () {
        var m = cardModel(buildOrder(best.r, S.party, cardDiet), cardDiet[0] || null);
        return '<div class="preview" aria-label="Preview of the card">' + zh(m.greeting.zh, 'zs') +
          m.items.map(function (it) { return zh(it.zh + (it.qzh ? ' ' + it.qzh : ''), 'zo'); }).join('') +
          (m.card ? zh(m.card.statement.zh) : '') + zh(m.closing.zh, 'zs') +
          '<small>' + (m.card ? esc(m.card.titleEn) + ' and your order, in Chinese for the staff' : 'Pick something you can’t eat and the card says it for you.') + '</small></div>';
      })() +

    h += '<section class="tile wide t-rest" ' + delay() + '"><h3>Not quite your chips, still worth a look</h3><ul>' + rest.map(function (x) {
      var l = lk(x.r);
      return '<li><a href="#/r/' + x.r.id + '" class="press">' + sticker(l.art) + '<span>' + esc(splitName(x.r.nameEn).main) + (x.e.clash ? '<p>Clashes with “' + esc(x.e.diet.filter(function (q) { return q.tone === 'clash'; })[0].label) + '”</p>' : '<p>' + esc(P.districts[x.r.district].nameEn) + ', ' + esc(CUISINE[x.r.cuisines[0]]) + '</p>') + '</span></a></li>';
    }).join('') + '</ul></section>';
    var lib = libDishes(best.r)[0] ? { r: best.r, d: libDishes(best.r)[0] } : null;
    if (!lib) P.restaurants.some(function (r) { var l = libDishes(r)[0]; if (l) { lib = { r: r, d: l }; return true; } return false; });
    if (lib) h += '<a class="tile wide t-dish press" href="#/r/' + lib.r.id + '?ask=' + lib.d.slug + '" ' + delay() + '">' + sticker(lk(lib.r).art) +
      '<span><h3>New to ' + esc(shortDish(lib.d)) + '?</h3><p>Ask me what it is, how you eat it, and what’s in it.</p></span></a>';
  }

function picker() {

    }).join('') + '</div>';
  }).join('') + '</div>';
}

/* ---------- restaurant ---------- */
function placeView(r) {
  var l = lk(r), n = splitName(r.nameEn), e = evaluate(r, S.chips), lib = libDishes(r), nc = notConfirmed(r);

    '<div class="pills"><span class="pill">' + esc(P.districts[r.district].nameEn) + '</span><span class="pill">' + esc(CUISINE[r.cuisines[0]]) + '</span>' +

  var ver = verifiedDishes(r), one = singleDishes(r);

    return '<li>' + (d.slug ? '<a class="dish press" href="#/r/' + r.id + '?ask=' + d.slug + '">' + inner + '</a>' : '<div class="dish">' + inner + '</div>') + '</li>';
  }).join('') + one.map(function (d) {
    return '<li><div class="dish single"><span class="nm">' + zh(d.nameZh) + '<span class="en">' + esc(d.nameEn) + '</span></span><span class="b1">One source</span></div></li>';
  }).join('') + '</ul>' +
    '<p class="note" style="margin-left:0">' + (lib.length ? 'Tap ' + esc(listJoin(lib.map(shortDish))) + ' and I’ll tell you about it.' : 'None of these has an entry in our dish notes yet, so there are no allergen notes to show you.') + '</p></section>';

function askOverlay(r, slug, topic) {
  if (slug === 'none' || !P.dishes[slug]) {
    return '<div class="ov" data-act="close-ask"><section class="chat" role="dialog" aria-modal="true" aria-labelledby="ask-h"><div class="chat-h">' + sticker(lk(r).art) + '<h2 id="ask-h">Nothing to ask about yet</h2><a class="close press" href="#/r/' + r.id + '" aria-label="Close">' + ic('x') + '</a></div>' +
      '<div class="bubbles"><div class="them"><p>None of the dishes at ' + esc(splitName(r.nameEn).main) + ' has an entry in our dish notes yet, so I have nothing to answer from. The staff card can ask for you.</p></div></div></section></div>';
  }
  var d = P.dishes[slug], a = askAnswer(slug, topic);
  return '<div class="ov" data-act="close-ask"><section class="chat" role="dialog" aria-modal="true" aria-labelledby="ask-h">' +
    '<div class="chat-h">' + sticker(lk(r).art) + '<h2 id="ask-h">' + esc(shortDish(d)) + zh(d.nameZh) + '</h2><a class="close press" href="#/r/' + r.id + '" aria-label="Close">' + ic('x') + '</a></div>' +

    '<div class="qbtns" role="group" aria-label="Ask something else">' + ASK_TOPICS.map(function (t) {
      return '<a class="press" href="#/r/' + r.id + '?ask=' + slug + '&t=' + t[0] + '" aria-current="' + (t[0] === topic) + '">' + esc(t[1]) + '</a>';

/* ---------- order ---------- */
function orderView(r) {

  if (o.ask.length) h += '<p class="sub-h">Ask the staff first</p><ul class="olist">' + o.ask.map(item).join('') + '</ul>';

  if (o.single.length) h += '<p class="note" style="margin-left:0">' + o.single.length + ' more ' + (o.single.length === 1 ? 'dish has' : 'dishes have') + ' only one source, so I left ' + (o.single.length === 1 ? 'it' : 'them') + ' out.</p>';

  h += '</section><div class="cta"><a class="btn ink full press" href="' + cardHash(r.id) + '" style="min-height:60px;font-size:21px">Make my staff card ' + ic('right') + '</a></div>';

    (ids.length > 1 ? '<div class="cswitch">' + ids.map(function (id, i) { return '<a class="press" href="' + cardHash(r.id, i) + '" aria-current="' + (i === ci) + '">' + esc(P.cards[id].titleEn) + '</a>'; }).join('') + '</div>' : '') +
    '<section class="paper" lang="zh-Hans"><p class="g">' + esc(m.greeting.zh) + '</p>' +
    (m.items.length ? '<ul>' + m.items.map(function (it) { return '<li>' + esc(it.zh) + (it.qzh ? '<b>' + esc(it.qzh) + '</b>' : '') + '</li>'; }).join('') + '</ul>' : '') +
    (m.card ? '<p class="st1">' + esc(m.body[0].zh) + '</p>' + m.body.slice(1).map(function (x) { return '<p class="s2">' + esc(x.zh) + '</p>'; }).join('') : '') +
    '<p class="cl">' + esc(m.closing.zh) + '</p></section>' +
    '<section class="gloss"><h2>What it says, in English</h2><p>' + esc(m.greeting.en) + '</p>' +
    (m.items.length ? '<ol>' + m.items.map(function (it) { return '<li><b>' + esc(it.en) + '</b>' + (it.qen ? '. ' + esc(it.qen) : '') + '</li>'; }).join('') + '</ol>' : '<p><i>No dish from the verified list fits, so the card lists none.</i></p>') +
    (m.card ? m.body.map(function (x) { return '<p>' + esc(x.en) + '</p>'; }).join('') : '<p><i>You haven’t picked anything you can’t eat, so there’s no dietary line.</i></p>') +
    '<p>' + esc(m.closing.en) + '</p>' + (m.card && m.card.noteEn ? '<p>' + esc(m.card.noteEn) + '</p>' : '') +
    '<p class="warn">' + ic('warn') + '<span>' + esc(P.cardsDisclaimer) + '</span></p></section></div>';
}

/* ---------- router ---------- */
var lastView = '';
function render() {
  var h = parseHash(), p = h.parts, q = h.q;
  if (q.chips !== undefined) {
    var c = q.chips.split(',').filter(function (v) { return OPT[v]; });
    if (!S.submitted || c.join() !== S.chips.join()) { S.chips = c; S.diet = null; }
    S.submitted = true;
  } else if (!p.length) S.submitted = false;
  if (q.n) S.party = Math.max(1, Math.min(6, Math.round(Number(q.n) || 2)));
  if (q.diet !== undefined) S.diet = q.diet.split(',').filter(function (v) { return P.cards[v]; });
  var r = p[1] ? byId(p[1]) : null;
  var view = p[0] === 'r' && r ? 'r-' + r.id : p[0] === 'order' && r ? 'o-' + r.id : p[0] === 'card' && r ? 'c-' + r.id : 'home';
  var same = view === lastView;
  var y = window.scrollY;
  if (view.indexOf('r-') === 0) root.innerHTML = '<div class="app">' + placeView(r) + '</div>';
  else if (view.indexOf('o-') === 0) root.innerHTML = '<div class="app">' + orderView(r) + '</div>';
  else if (view.indexOf('c-') === 0) root.innerHTML = cardView(r, q);
  else root.innerHTML = '<div class="app">' + homeView() + '</div>';
  ov.innerHTML = (view.indexOf('r-') === 0 && q.ask) ? askOverlay(r, q.ask, q.t || 'what') : '';
  lastView = view;
  window.scrollTo(0, same ? y : 0);
}
function act(a, t, e) {
  if (a === 'parse') {
    var ta = document.getElementById('say');
    S.said = (ta && ta.value.trim()) || PREFILL;
    var p = parseSentence(S.said);
    S.chips = p.chips; if (p.party) S.party = p.party; S.diet = null; S.submitted = true; S.picking = false; S.animate = true;
    location.hash = homeHash();
  } else if (a === 'rm') {
    var v = t.getAttribute('data-v');
    t.classList.add('bye');
    setTimeout(function () { S.chips = S.chips.filter(function (x) { return x !== v; }); S.diet = null; location.hash = homeHash(); }, REDUCED ? 0 : 160);
  } else if (a === 'pick') { S.picking = !S.picking; render(); }
  else if (a === 'toggle') {
    var w = t.getAttribute('data-v');
    S.chips = S.chips.indexOf(w) >= 0 ? S.chips.filter(function (x) { return x !== w; }) : S.chips.concat([w]);
    S.diet = null; location.hash = homeHash();
  } else if (a === 'edit') { S.submitted = false; S.animate = true; location.hash = '#/'; render(); }
  else if (a === 'driver') {
    var r = byId(parseHash().parts[1]);
    var d = document.createElement('div');
    d.innerHTML = '<div class="driver" role="dialog" aria-modal="true" aria-label="Address for your driver"><button class="close press" data-act="close-driver" aria-label="Close">' + ic('x') + '</button><div class="in"><p>Please take me here</p>' + zh(r.addressZh) + '<p style="margin-top:14px;font-family:Nunito,sans-serif;font-size:17px;font-weight:700">' + esc(r.addressEn) + '</p></div></div>';
    document.body.appendChild(d.firstChild);
    document.querySelector('.driver .close').focus();
  } else if (a === 'close-driver') { var dr = document.querySelector('.driver'); if (dr) dr.remove(); }
  else if (a === 'close-ask') { if (e.target === t) location.hash = '#/r/' + parseHash().parts[1]; }
}
document.addEventListener('click', function (e) {
  var t = e.target.closest('[data-act]');
  if (!t) return;
  var a = t.getAttribute('data-act');
  if (a === 'close-ask') { if (e.target === t) { e.preventDefault(); act(a, t, e); } return; }
  e.preventDefault();
  act(a, t, e);
});
document.addEventListener('submit', function (e) { if (e.target.id === 'tellf') { e.preventDefault(); act('parse'); } });
document.addEventListener('keydown', function (e) {
  if (e.key !== 'Escape') return;
  var dr = document.querySelector('.driver');
  if (dr) dr.remove(); else if (ov.innerHTML) location.hash = '#/r/' + parseHash().parts[1];
});
window.addEventListener('hashchange', render);
render();
})();
</script>
</body>
