<!doctype html>
<!--
  V6 "Deck": interaction-first phone prototype.
  Font: Bricolage Grotesque (variable, latin subset), designed by Mathieu Triay,
  SIL Open Font License 1.1. Self-hosted from fonts/ (Fontsource
  @fontsource-variable/bricolage-grotesque 5.2.7). Chinese uses the system stack.
  All imagery is hand-written inline SVG. No network requests at runtime.
-->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#0E0E0F">
<title>Deck · China Food Guide</title>
<style>
@font-face {
  font-family: "Bricolage";
  src: url("fonts/bricolage-grotesque-latin-standard-normal.woff2") format("woff2");
  font-weight: 200 800; font-stretch: 75% 100%; font-display: swap;
}
:root {
  --bg: #0E0E0F; --bg2: #1B1B1E; --bg3: #26262A;
  --ink: #F4F1EA; --mute: #BDB8AE; --line: rgba(244, 241, 234, .18);
  --lime: #C8F03C; --lime-ink: #10140A;
  --paper: #F7F4EE; --paper-ink: #151515; --paper-mute: #57534C; --paper-line: #DED8CC;
  --warn-bg: #FFE9E2; --warn-ink: #7A1607;
  --spring: cubic-bezier(.34, 1.56, .64, 1);
  --ease: cubic-bezier(.2, .7, .2, 1);
  --zh: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
  --pill-h: 64px;
  --safe-b: env(safe-area-inset-bottom, 0px);
  --safe-t: env(safe-area-inset-top, 0px);
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body {
  background: #050505; color: var(--ink);
  font-family: "Bricolage", system-ui, sans-serif; font-size: 17px; line-height: 1.45;
  -webkit-font-smoothing: antialiased; overscroll-behavior: none;
  -webkit-tap-highlight-color: transparent;
}
.zh, [lang="zh-Hans"] { font-family: var(--zh); }
button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; }
a { color: inherit; }
:focus-visible { outline: 3px solid var(--lime); outline-offset: 2px; }
[hidden] { display: none !important; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
svg.i { width: 24px; height: 24px; fill: none; stroke: currentColor; stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round; flex: none; }

.phone { position: relative; max-width: 430px; margin: 0 auto; height: 100vh; height: 100dvh; background: var(--bg); overflow: hidden; }

/* ---------- discover ---------- */
.screen {
  height: 100%; display: flex; flex-direction: column;
  padding: var(--safe-t) 0 calc(var(--pill-h) + 18px + var(--safe-b));
}
.top { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 10px 16px 6px; min-height: 52px; }
.brand { display: flex; align-items: center; gap: 9px; text-decoration: none; font-weight: 800; font-stretch: 78%; font-size: 23px; letter-spacing: -.01em; line-height: 1; min-height: 44px; }
.brand-mark { width: 30px; height: 30px; flex: none; }
.brand b { color: var(--lime); font-weight: 800; }
.proto { font-size: 14px; font-weight: 600; color: var(--mute); border: 1.5px solid var(--line); border-radius: 99px; padding: 4px 10px; white-space: nowrap; }

.chipbar { padding: 4px 0 2px; }
.chips-scroll { display: flex; gap: 8px; overflow-x: auto; padding: 4px 16px 6px; scrollbar-width: none; }
.chips-scroll::-webkit-scrollbar { display: none; }
.chip {
  flex: none; display: inline-flex; align-items: center; gap: 6px; min-height: 44px; padding: 0 14px;
  border-radius: 99px; background: var(--bg3); color: var(--ink); font-weight: 600; font-size: 16px; white-space: nowrap;
  transition: transform .25s var(--spring), background .2s;
}
.chip svg.i { width: 18px; height: 18px; }
.chip:active { transform: scale(.94); }
.chip.on { background: var(--ink); color: var(--bg); }
.chip.ghost { background: transparent; box-shadow: inset 0 0 0 1.5px var(--line); }
.demo { margin: 0; padding: 0 16px; font-size: 15px; color: var(--mute); }

.deck { position: relative; flex: 1 1 auto; min-height: 0; margin: 8px 16px 0; }
.deck-inner { position: absolute; inset: 0 0 26px 0; }
.dcard {
  position: absolute; inset: 0; border-radius: 30px; background: var(--c); color: var(--k);
  padding: 16px 18px 18px; display: flex; flex-direction: column; overflow: hidden;
  touch-action: none; user-select: none; -webkit-user-select: none; cursor: grab;
  transform-origin: 50% 100%; will-change: transform;
  transition: transform .5s var(--spring), opacity .3s var(--ease);
}
.dcard:active { cursor: grabbing; }
.dcard.l1 { transform: translateY(13px) scale(.95); pointer-events: none; }
.dcard.l2 { transform: translateY(26px) scale(.9); pointer-events: none; }
.dcard.hide { transform: translateY(40px) scale(.85); opacity: 0; pointer-events: none; }
.dcard.l1 .dc-body, .dcard.l2 .dc-body { visibility: hidden; }
.dc-body { display: flex; flex-direction: column; height: 100%; min-height: 0; }
.dc-top { display: flex; justify-content: space-between; align-items: center; gap: 8px; font-weight: 700; font-size: 15px; letter-spacing: .04em; text-transform: uppercase; }
.dc-fitall { background: var(--k); color: var(--c); border-radius: 99px; padding: 3px 10px; letter-spacing: .02em; }
.dc-emblem { flex: 1 1 auto; min-height: 0; display: flex; align-items: center; justify-content: center; padding: 6px 0; }
.dc-emblem svg { width: 100%; height: 100%; max-height: 210px; }
.dc-name { margin: 0; font-weight: 800; font-stretch: 75%; font-size: clamp(31px, 10.4vw, 44px); line-height: .94; letter-spacing: -.012em; }
.dc-sub { margin: 6px 0 0; font-size: 16px; font-weight: 600; line-height: 1.3; }
.dc-sub .zh { font-weight: 600; }
.fits { list-style: none; margin: 12px 0 0; padding: 0; display: flex; flex-wrap: wrap; gap: 6px; }
.fits li { display: inline-flex; align-items: center; gap: 4px; font-size: 15px; font-weight: 700; padding: 4px 10px 4px 7px; border-radius: 99px; border: 2px solid currentColor; line-height: 1.2; }
.fits li svg.i { width: 16px; height: 16px; stroke-width: 3; }
.fits li.y { background: var(--k); color: var(--c); border-color: var(--k); }
.fits li.u { border-style: dashed; }
.dline { display: flex; gap: 8px; align-items: flex-start; margin: 10px 0 0; font-size: 16px; line-height: 1.35; font-weight: 500; }
.dline svg.i { width: 20px; height: 20px; margin-top: 1px; }
.dline.clash, .warn {
  background: var(--warn-bg); color: var(--warn-ink); border-radius: 14px; padding: 9px 11px;
  background-image: repeating-linear-gradient(135deg, transparent 0 9px, rgba(122, 22, 7, .07) 9px 13px);
}
.dline b { font-weight: 800; }
.stamp {
  position: absolute; top: 22px; font-weight: 800; font-stretch: 75%; font-size: 40px; letter-spacing: .02em; text-transform: uppercase;
  padding: 0 12px; border-radius: 12px; border: 4px solid currentColor; opacity: 0; pointer-events: none;
}
.stamp.keep { left: 18px; transform: rotate(-12deg); color: var(--lime); background: var(--lime-ink); }
.stamp.pass { right: 18px; transform: rotate(12deg); color: var(--ink); background: var(--bg); }
.deck-empty {
  position: absolute; inset: 0 0 26px 0; border-radius: 30px; border: 2px dashed var(--line);
  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px; text-align: center; padding: 24px;
}
.deck-empty h2 { margin: 0; font-stretch: 75%; font-size: 34px; line-height: 1; }

/* composer (before the sentence becomes chips) */
.composer {
  position: absolute; inset: 0 0 26px 0; border-radius: 30px; background: var(--bg2); padding: 20px 18px;
  display: flex; flex-direction: column; gap: 12px; box-shadow: inset 0 0 0 2px var(--line); z-index: 5;
}
.composer label { font-weight: 800; font-stretch: 75%; font-size: 36px; line-height: .98; }
.composer textarea {
  flex: 1 1 auto; min-height: 120px; width: 100%; resize: none; border: 0; border-radius: 18px;
  background: var(--bg3); color: var(--ink); font: 500 21px/1.35 "Bricolage", system-ui, sans-serif; padding: 14px 16px;
}
.composer textarea:focus { outline: 2px solid var(--lime); }
.composer p { margin: 0; color: var(--mute); font-size: 16px; }
.peek { position: absolute; left: 0; right: 0; bottom: 0; height: 60px; border-radius: 30px; transform-origin: 50% 100%; }

.controls { padding: 6px 16px 0; }
.meta-row { display: flex; align-items: center; justify-content: space-between; gap: 8px; min-height: 44px; }
.dots { display: flex; align-items: center; }
.dot { width: 34px; height: 44px; display: grid; place-items: center; }
.dot span { width: 12px; height: 12px; border-radius: 99px; background: var(--dc); box-shadow: 0 0 0 2px var(--bg); transition: transform .3s var(--spring); }
.dot[aria-current="true"] span { transform: scale(1.55); box-shadow: 0 0 0 2px var(--bg), 0 0 0 4px var(--ink); }
.dot.kept span { background: transparent; box-shadow: inset 0 0 0 2.5px var(--dc); }
.tray { display: flex; align-items: center; gap: 8px; min-height: 44px; padding: 0 4px 0 10px; border-radius: 99px; font-weight: 700; font-size: 15px; color: var(--ink); }
.tray-stack { display: flex; }
.tray-stack span { width: 30px; height: 30px; border-radius: 99px; background: var(--tc); margin-left: -10px; box-shadow: 0 0 0 2.5px var(--bg); display: grid; place-items: center; color: var(--tk); }
.tray-stack span svg { width: 22px; height: 22px; }
.tray-stack span:first-child { margin-left: 0; }
.tray.bump .tray-stack { animation: bump .45s var(--spring); }
@keyframes bump { 0% { transform: scale(1); } 40% { transform: scale(1.25); } 100% { transform: scale(1); } }
.btns { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: 10px; padding: 4px 0 0; }
.rb { display: flex; flex-direction: column; align-items: center; gap: 3px; font-size: 15px; font-weight: 700; color: var(--mute); }
.rb .disc { width: 64px; height: 64px; border-radius: 99px; display: grid; place-items: center; background: var(--bg3); color: var(--ink); transition: transform .3s var(--spring), background .2s; }
.rb .disc svg.i { width: 30px; height: 30px; stroke-width: 2.6; }
.rb.keep .disc { background: var(--lime); color: var(--lime-ink); }
.rb.info .disc { width: 52px; height: 52px; background: transparent; box-shadow: inset 0 0 0 2px var(--line); }
.rb:active .disc { transform: scale(.88); }
.rb.pass { justify-self: end; } .rb.keep { justify-self: start; }
.deal { width: 100%; min-height: 64px; border-radius: 99px; background: var(--lime); color: var(--lime-ink); font-weight: 800; font-size: 21px; font-stretch: 85%; display: flex; align-items: center; justify-content: center; gap: 10px; transition: transform .3s var(--spring); }
.deal:active { transform: scale(.96); }

/* ---------- floating pill bar ---------- */
.pillbar {
  position: fixed; z-index: 60; left: 50%; bottom: calc(10px + var(--safe-b)); transform: translateX(-50%);
  display: flex; gap: 4px; padding: 6px; height: var(--pill-h); border-radius: 99px;
  background: rgba(38, 38, 42, .62); -webkit-backdrop-filter: blur(22px) saturate(1.7); backdrop-filter: blur(22px) saturate(1.7);
  box-shadow: inset 0 0 0 1px rgba(255, 255, 255, .14);
  transition: transform .4s var(--spring), opacity .25s;
}
.pillbar a { display: flex; align-items: center; gap: 7px; padding: 0 16px; border-radius: 99px; text-decoration: none; font-weight: 700; font-size: 16px; color: var(--ink); white-space: nowrap; min-width: 44px; transition: background .2s, transform .25s var(--spring); }
.pillbar a:active { transform: scale(.93); }
.pillbar a[aria-current="page"] { background: rgba(244, 241, 234, .16); }
.pillbar .badge { min-width: 22px; height: 22px; border-radius: 99px; background: var(--lime); color: var(--lime-ink); font-size: 14px; display: grid; place-items: center; padding: 0 6px; }
.phone.covered .pillbar { transform: translate(-50%, 140%); opacity: 0; pointer-events: none; }

/* ---------- sheets ---------- */
.layer { position: fixed; inset: 0; z-index: 50; display: flex; justify-content: center; pointer-events: none; }
.layer > * { pointer-events: auto; }
.scrim { position: absolute; inset: 0; background: rgba(0, 0, 0, .5); opacity: 0; transition: opacity .3s; }
.layer.open .scrim { opacity: 1; }
.sheet {
  position: absolute; left: 50%; width: min(100%, 430px); top: 0; height: 100%;
  margin-left: max(-215px, -50%);
  background: var(--paper); color: var(--paper-ink); border-radius: 26px 26px 0 0;
  display: flex; flex-direction: column; transform: translateY(100%); will-change: transform;
}
.sheet.anim { transition: transform .5s var(--spring); }
.grab { flex: none; touch-action: none; cursor: grab; padding: 8px 18px 12px; background: var(--c); color: var(--k); border-radius: 26px 26px 0 0; user-select: none; -webkit-user-select: none; }
.handle { display: block; width: 44px; height: 5px; border-radius: 99px; background: currentColor; opacity: .55; margin: 0 auto 10px; }
.grab-top { display: grid; grid-template-columns: 1fr auto 1fr; align-items: start; gap: 8px; margin-bottom: 4px; }
.grab-top .handle { margin: 4px 0 0; }
.grab-top .proto { justify-self: start; }
.grab-row { display: flex; align-items: flex-start; gap: 12px; }
.grab-row .emb { width: 76px; height: 62px; flex: none; }
.grab-row h2 { margin: 0; font-weight: 800; font-stretch: 75%; font-size: 32px; line-height: .95; letter-spacing: -.01em; }
.grab-row p { margin: 4px 0 0; font-size: 16px; font-weight: 600; }
.grab .proto { color: inherit; border-color: currentColor; opacity: .85; font-size: 13px; }
.grab-meta { margin-top: 8px; font-size: 16px; font-weight: 700; line-height: 1.3; }
.sh-actions .btn { font-size: 16px; padding: 0 10px; gap: 6px; }
.sh-actions .btn svg.i { width: 20px; height: 20px; }
.sh-x { width: 44px; height: 44px; border-radius: 99px; display: grid; place-items: center; margin: -6px -8px 0 auto; flex: none; }
.sh-scroll { flex: 1 1 auto; overflow-y: auto; -webkit-overflow-scrolling: touch; overscroll-behavior: contain; padding: 16px 18px 24px; }
.sh-why { font-size: 22px; line-height: 1.28; font-weight: 600; margin: 0 0 14px; letter-spacing: -.005em; }
.sh-scroll .fits { margin: 0 0 4px; color: var(--paper-ink); }
.sh-scroll .fits li.y { background: var(--paper-ink); color: var(--paper); border-color: var(--paper-ink); }
.sh-scroll .dline { color: var(--paper-ink); }
.sh-scroll .dline.clash { color: var(--warn-ink); }
.sec { margin: 22px 0 0; }
.sec h3, .o-h { margin: 0 0 6px; font-size: 15px; font-weight: 800; letter-spacing: .06em; text-transform: uppercase; color: var(--paper-mute); }
.sec p { margin: 0; }
.plate {
  margin: 20px 0 0; width: 100%; text-align: left; border-radius: 20px; padding: 14px 16px 16px; background: var(--paper-ink); color: var(--paper);
  display: block; transition: transform .3s var(--spring);
}
.plate:active { transform: scale(.98); }
.plate-l { display: flex; justify-content: space-between; align-items: center; font-size: 15px; font-weight: 700; letter-spacing: .05em; text-transform: uppercase; color: #CFC9BD; }
.plate .zh { display: block; font-size: 27px; line-height: 1.3; font-weight: 600; margin: 8px 0 6px; color: #fff; }
.plate .en { font-size: 16px; color: #DCD6CA; }
.note { font-size: 16px; color: var(--paper-mute); margin: 8px 0 0; }
.dishes { list-style: none; margin: 0; padding: 0; }
.dishes li { border-top: 1.5px solid var(--paper-line); }
.dishes li:first-child { border-top: 0; }
.dish { width: 100%; display: flex; align-items: center; gap: 12px; padding: 10px 0; min-height: 56px; text-align: left; }
.dish .nm { flex: 1; }
.dish .nm .zh { display: block; font-size: 20px; font-weight: 600; }
.dish .nm span:last-child { font-size: 16px; }
.tag { flex: none; font-size: 14px; font-weight: 700; border-radius: 99px; padding: 3px 10px; white-space: nowrap; }
.tag.two { background: var(--paper-ink); color: var(--paper); }
.tag.one { box-shadow: inset 0 0 0 1.5px var(--paper-mute); color: var(--paper-mute); }
.dish .go { flex: none; display: inline-flex; align-items: center; gap: 4px; font-size: 15px; font-weight: 700; text-decoration: underline; text-underline-offset: 3px; }
.single .dish { color: var(--paper-mute); }
.unconf { margin: 22px 0 0; padding: 12px 14px; border-radius: 16px; background: #ECE7DC; font-size: 16px; }
.srcs { font-size: 16px; color: var(--paper-mute); margin: 14px 0 0; }
.sh-actions { flex: none; display: grid; grid-template-columns: 1fr 1fr; gap: 10px; padding: 12px 16px calc(12px + var(--safe-b)); background: var(--paper); box-shadow: 0 -1px 0 var(--paper-line); }
.btn { min-height: 56px; border-radius: 99px; display: flex; align-items: center; justify-content: center; gap: 8px; padding: 0 16px; font-weight: 800; font-size: 17px; text-decoration: none; text-align: center; line-height: 1.15; transition: transform .3s var(--spring); }
.btn:active { transform: scale(.95); }
.btn.pri { background: var(--paper-ink); color: var(--lime); }
.btn.sec2 { box-shadow: inset 0 0 0 2px var(--paper-ink); color: var(--paper-ink); }
.btn.lime { background: var(--lime); color: var(--lime-ink); }
.btn[aria-disabled="true"] { opacity: .62; }

/* ask sheet: a shorter sheet on top */
.ask .sheet { top: auto; height: auto; max-height: 82%; bottom: 0; }
.ask-head { padding: 8px 18px 4px; }
.ask-head .handle { background: var(--paper-ink); }
.ask-head h2 { margin: 2px 0 0; font-weight: 800; font-stretch: 75%; font-size: 30px; line-height: 1; }
.ask-head p { margin: 4px 0 0; font-size: 16px; color: var(--paper-mute); }
.seg { display: flex; flex-wrap: wrap; gap: 8px; padding: 12px 18px 4px; }
.seg button { min-height: 44px; padding: 0 14px; border-radius: 99px; font-weight: 700; font-size: 16px; box-shadow: inset 0 0 0 2px var(--paper-ink); transition: transform .25s var(--spring); }
.seg button[aria-pressed="true"] { background: var(--paper-ink); color: var(--paper); }
.seg button:active { transform: scale(.94); }
.answer { padding: 8px 18px calc(20px + var(--safe-b)); overflow-y: auto; }
.answer .q { font-weight: 800; font-size: 19px; margin: 6px 0 6px; }
.answer p { margin: 0 0 10px; }
.answer dl { margin: 0; }
.answer dt { font-weight: 800; margin-top: 8px; }
.answer dd { margin: 0; }
.from { font-size: 16px; color: var(--paper-mute); }

/* driver plate overlay */
.driver { position: absolute; inset: 0; background: #000; color: #fff; display: flex; flex-direction: column; justify-content: center; padding: 24px 20px calc(24px + var(--safe-b)); width: min(100%, 430px); left: 50%; margin-left: max(-215px, -50%); }
.driver .zh { font-size: clamp(34px, 11vw, 46px); line-height: 1.3; font-weight: 700; }
.driver p { margin: 0 0 14px; }
.driver .x { position: absolute; top: calc(12px + var(--safe-t)); right: 12px; }

/* ---------- pushed pages: order, shortlist ---------- */
.page {
  position: absolute; inset: 0; width: min(100%, 430px); left: 50%; margin-left: max(-215px, -50%);
  background: var(--bg); color: var(--ink); display: flex; flex-direction: column; transform: translateX(100%);
}
.page.anim { transition: transform .45s var(--ease); }
.page.in { transform: none; }
.pg-top { flex: none; display: flex; align-items: center; gap: 8px; padding: calc(8px + var(--safe-t)) 10px 8px; min-height: 60px; }
.pg-top h1 { margin: 0; flex: 1; font-weight: 800; font-stretch: 75%; font-size: 28px; line-height: 1; }
.nav-back { min-width: 44px; min-height: 44px; display: grid; place-items: center; border-radius: 99px; }
.pg-body { flex: 1 1 auto; overflow-y: auto; padding: 4px 16px 24px; overscroll-behavior: contain; }
.pg-cta { flex: none; padding: 10px 16px calc(12px + var(--safe-b)); }
.o-rest { display: flex; align-items: center; gap: 12px; background: var(--c); color: var(--k); border-radius: 22px; padding: 10px 14px; }
.o-rest svg { width: 64px; height: 52px; flex: none; }
.o-rest b { font-stretch: 75%; font-weight: 800; font-size: 22px; line-height: 1; display: block; }
.stepper { display: flex; align-items: center; justify-content: space-between; margin: 18px 0 0; padding: 12px 12px 12px 16px; border-radius: 22px; background: var(--bg2); }
.stepper .lbl { font-weight: 700; font-size: 18px; }
.stepper .ctl { display: flex; align-items: center; gap: 6px; }
.stepper button { width: 52px; height: 52px; border-radius: 99px; background: var(--bg3); display: grid; place-items: center; transition: transform .25s var(--spring); }
.stepper button:active { transform: scale(.88); }
.stepper output { min-width: 52px; text-align: center; font-weight: 800; font-stretch: 75%; font-size: 46px; line-height: 1; }
.stepper output.pop { animation: bump .4s var(--spring); }
.togs { margin: 10px 0 0; padding: 6px 0; border-radius: 22px; background: var(--bg2); }
.togs p { margin: 6px 16px 2px; font-weight: 700; font-size: 18px; }
.tog { width: 100%; display: flex; align-items: center; justify-content: space-between; gap: 12px; min-height: 52px; padding: 0 16px; font-size: 17px; font-weight: 600; text-align: left; }
.sw { width: 52px; height: 32px; border-radius: 99px; background: var(--bg3); position: relative; flex: none; transition: background .2s; box-shadow: inset 0 0 0 1.5px var(--line); }
.sw::after { content: ""; position: absolute; top: 4px; left: 4px; width: 24px; height: 24px; border-radius: 99px; background: var(--ink); transition: transform .35s var(--spring); }
.tog[aria-checked="true"] .sw { background: var(--lime); }
.tog[aria-checked="true"] .sw::after { transform: translateX(20px); background: var(--lime-ink); }
.pg-body .demo { padding: 10px 2px 0; }
.out { margin: 18px 0 0; }
.out .o-h { color: var(--mute); margin-top: 18px; }
.olist { list-style: none; margin: 0; padding: 0; display: grid; gap: 8px; }
.olist li { background: var(--paper); color: var(--paper-ink); border-radius: 20px; padding: 12px 14px; }
.olist li.enter { animation: rise .45s var(--spring) both; }

function bindDeck() {

    var el = e.target.closest('.dcard.l0');

    var now = performance.now();

    if (!drag || e.pointerId !== drag.id) return;

    var v = 0;

  var d = null;

    if (e.target.closest('button, a')) return;

      return '<div class="seg" role="group" aria-label="' + esc(GROUP_LABEL[k]) + '"><p class="o-h" style="width:100%;margin:6px 0 0">' + esc(GROUP_LABEL[k]) + '</p>' + by[k].map(function (o) {
        return '<button data-act="toggle-chip" data-v="' + o.v + '" aria-pressed="' + (S.chips.indexOf(o.v) >= 0) + '">' + esc(o.label) + '</button>';
      }).join('') + '</div>';
    }).join('') +
    '<div class="answer"><button class="btn pri" style="width:100%" data-act="chips-done">Done, re-deal</button></div></section>');
}

document.addEventListener('click', function (e) {
  var t = e.target.closest('[data-act]');
  if (!t) return;
  var a = t.getAttribute('data-act');
  if (a === 'deal') return;
  e.preventDefault();
  act(a, t);
});
document.addEventListener('submit', function (e) { if (e.target.id === 'composer') { e.preventDefault(); act('deal'); } });
document.addEventListener('keydown', function (e) {
  if (e.key === 'Escape') {
    if (!L.top.hidden && !L.top.querySelector('.cardpage')) hideLayer(L.top);
    else if (!L.ask.hidden) act('close-ask');
    else if (!L.sheet.hidden) act('close-sheet');
  }
  if (e.key === 'Enter' && e.target.id === 'say' && !e.shiftKey) { e.preventDefault(); act('deal'); }
});
window.addEventListener('hashchange', render);
render();
})();
</script>
</body>
</html>
