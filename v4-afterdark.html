<!doctype html>
<!--
  V4 "After Dark": quiet luxury. Warm near-black stage, a high-contrast display serif, wide-tracked small caps,
  brass hairlines, slow fades, one restaurant per page. The staff card stays a white card with black Chinese.
  Fonts (self-hosted in fonts/):
    Bodoni Moda (variable, opsz + wght, roman and italic), by Owen Earl / indestructible type*, SIL Open Font License 1.1.
    Jost (variable wght), by Owen Earl / indestructible type*, SIL Open Font License 1.1.
  Chinese uses the system stack only. No images, no icons, no gradients, no network requests at runtime.
  Contrast (WCAG): ivory #eee6d6 on #130f0d 15.4:1; muted #b3a68f 8.0:1; brass #c8a45e 8.1:1; coral warning #f2a391 9.5:1;
  dark text #130f0d on brass 8.1:1; black on the white card 21:1.
-->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#130f0d">
<title>After Dark · China Food Guide</title>
<style>
@font-face { font-family: "Bodoni Moda"; src: url(fonts/bodoni-moda-latin-standard-normal.woff2) format("woff2"); font-weight: 400 900; font-style: normal; font-display: swap;
  unicode-range: U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+0304,U+0308,U+0329,U+2000-206F,U+20AC,U+2122,U+2191,U+2193,U+2212,U+2215,U+FEFF,U+FFFD; }
@font-face { font-family: "Bodoni Moda"; src: url(fonts/bodoni-moda-latin-ext-standard-normal.woff2) format("woff2"); font-weight: 400 900; font-style: normal; font-display: swap;
  unicode-range: U+0100-02BA,U+02BD-02C5,U+02C7-02CC,U+02CE-02D7,U+02DD-02FF,U+0304,U+0308,U+0329,U+1D00-1DBF,U+1E00-1E9F,U+1EF2-1EFF,U+2020,U+20A0-20AB,U+20AD-20C0,U+2113,U+2C60-2C7F,U+A720-A7FF; }
@font-face { font-family: "Bodoni Moda"; src: url(fonts/bodoni-moda-latin-standard-italic.woff2) format("woff2"); font-weight: 400 900; font-style: italic; font-display: swap;
  unicode-range: U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+0304,U+0308,U+0329,U+2000-206F,U+20AC,U+2122,U+2191,U+2193,U+2212,U+2215,U+FEFF,U+FFFD; }
@font-face { font-family: "Jost"; src: url(fonts/jost-latin-wght-normal.woff2) format("woff2"); font-weight: 100 900; font-display: swap;
  unicode-range: U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+0304,U+0308,U+0329,U+2000-206F,U+20AC,U+2122,U+2191,U+2193,U+2212,U+2215,U+FEFF,U+FFFD; }
@font-face { font-family: "Jost"; src: url(fonts/jost-latin-ext-wght-normal.woff2) format("woff2"); font-weight: 100 900; font-display: swap;
  unicode-range: U+0100-02BA,U+02BD-02C5,U+02C7-02CC,U+02CE-02D7,U+02DD-02FF,U+0304,U+0308,U+0329,U+1D00-1DBF,U+1E00-1E9F,U+1EF2-1EFF,U+2020,U+20A0-20AB,U+20AD-20C0,U+2113,U+2C60-2C7F,U+A720-A7FF; }

:root {
  --ground: #130f0d; --raise: #1c1613; --ivory: #eee6d6; --mute: #b3a68f;
  --brass: #c8a45e; --hair: #5a4a30; --warn: #f2a391;
  --m: 28px;
  --serif: "Bodoni Moda", "Didot", "Bodoni 72", Georgia, serif;
  --sans: "Jost", -apple-system, "Helvetica Neue", sans-serif;
  --zh: -apple-system, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
  --slow: cubic-bezier(.2, .7, .2, 1);
}
@media (max-width: 359px) { :root { --m: 20px; } }
* { box-sizing: border-box; }
html { background: #0b0908; -webkit-text-size-adjust: 100%; }
body { margin: 0 auto; max-width: 430px; min-height: 100vh; min-height: 100svh; background: var(--ground); color: var(--ivory);
  font: 400 17px/1.6 var(--sans); overflow-x: hidden; }
body.locked { overflow: hidden; }
[lang="zh-Hans"] { font-family: var(--zh); }
a { color: inherit; }
p { margin: 0 0 16px; }
h1, h2 { margin: 0; font-weight: 400; }
button { font: inherit; color: inherit; }
:focus-visible { outline: 1px solid var(--brass); outline-offset: 3px; }
i, em { font-family: var(--serif); font-style: italic; }
.center { text-align: center; }
.fine { font-size: 16px; line-height: 1.55; color: var(--mute); }
.sc { font-family: var(--sans); font-size: 14px; line-height: 20px; font-weight: 500; letter-spacing: .24em; text-transform: uppercase; color: var(--mute); margin: 0 0 12px; }
.sc-c { text-align: center; }
#app.enter { animation: enter .9s var(--slow) both; }
@keyframes enter { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }

/* header */
.hd { padding: 10px var(--m) 0; }
.proto { font-family: var(--serif); font-style: italic; font-size: 15px; line-height: 20px; color: var(--mute); text-align: center; margin: 0; }
.hd-row { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; min-height: 48px; border-bottom: 1px solid var(--hair); }
.wm { justify-self: center; font-size: 14px; font-weight: 500; letter-spacing: .32em; text-transform: uppercase; text-decoration: none; color: var(--brass); padding: 12px 0 12px .32em; white-space: nowrap; }
.hd-back { justify-self: start; font-size: 14px; font-weight: 500; letter-spacing: .16em; text-transform: uppercase; text-decoration: none; color: var(--ivory);
  min-height: 44px; display: inline-flex; align-items: center; background: none; border: 0; padding: 0; cursor: pointer; }
.hd-sp { display: block; }

/* ornament and label rule: the recurring device */
.orn { width: 56px; height: 1px; background: var(--brass); margin: 24px auto; }
.lr { display: flex; align-items: center; gap: 14px; margin: 0 0 18px; }
.lr::before, .lr::after { content: ""; flex: 1; height: 1px; background: var(--hair); }
.lr span { font-size: 14px; line-height: 20px; font-weight: 500; letter-spacing: .24em; text-transform: uppercase; color: var(--brass); padding-left: .24em; }

/* intro */
.intro { padding: 40px var(--m) 24px; text-align: center; }
.eyebrow { font-size: 14px; letter-spacing: .3em; text-transform: uppercase; color: var(--mute); margin: 0 0 18px; font-weight: 500; }
.eyebrow span { letter-spacing: .1em; }
.display { font-family: var(--serif); font-size: 52px; line-height: 1.02; font-weight: 400; letter-spacing: -.01em; font-optical-sizing: auto; }
.display em { color: var(--brass); }
.ask { text-align: left; }
.ask .sc { display: block; text-align: center; }
textarea { display: block; width: 100%; font-family: var(--serif); font-style: italic; font-size: 22px; line-height: 1.45; color: var(--ivory); background: transparent;
  border: 0; border-top: 1px solid var(--hair); border-bottom: 1px solid var(--hair); padding: 16px 0; margin: 0 0 24px; resize: none; overflow: hidden; text-align: center; border-radius: 0; }
textarea:focus { outline: none; border-color: var(--brass); }
.btn { display: flex; align-items: center; justify-content: center; width: 100%; min-height: 52px; padding: 0 18px; font-size: 14px; font-weight: 500; letter-spacing: .22em;
  text-transform: uppercase; text-decoration: none; border-radius: 0; cursor: pointer; text-align: center; line-height: 20px; }
.btn-brass { background: var(--brass); color: var(--ground); border: 1px solid var(--brass); }
.btn-brass:active { background: #b8934f; }
.btn-line { background: transparent; color: var(--ivory); border: 1px solid var(--brass); }
.btn-line:active { background: var(--raise); }
.intro .fine { margin: 16px 0 0; font-family: var(--serif); font-style: italic; }
.lnk { background: none; border: 0; padding: 0; min-height: 44px; display: inline-flex; align-items: center; font-size: 14px; font-weight: 500; letter-spacing: .16em; text-transform: uppercase;
  color: var(--brass); cursor: pointer; text-decoration: underline; text-underline-offset: 6px; text-decoration-thickness: 1px; }

/* request summary and chips */
.req { padding: 18px var(--m) 4px; text-align: center; }
.req .sc { margin: 0 0 2px; }
.chips { list-style: none; margin: 0; padding: 0; display: flex; flex-wrap: wrap; justify-content: center; gap: 0 18px; }
.chip { min-height: 44px; padding: 8px 0 6px; display: inline-flex; align-items: center; gap: 8px; background: transparent; border: 0; border-bottom: 1px solid var(--brass); color: var(--ivory);
  border-radius: 0; cursor: pointer; font-family: var(--serif); font-style: italic; font-size: 19px; line-height: 24px; }
.chip span { color: var(--brass); font-family: var(--sans); font-style: normal; font-size: 16px; }
.chip-add { border-bottom-color: var(--hair); color: var(--mute); }
.req-acts { display: flex; justify-content: center; align-items: flex-start; gap: 24px; flex-wrap: wrap; margin: 6px 0 0; }
.more { margin: 0; }
.more[open] { flex-basis: 100%; order: 2; }
.more summary { list-style: none; min-height: 44px; display: inline-flex; align-items: center; font-size: 14px; letter-spacing: .16em; text-transform: uppercase; color: var(--mute); cursor: pointer; font-weight: 500; }
.more summary::-webkit-details-marker { display: none; }
.req .fine { font-family: var(--serif); font-style: italic; margin: 0 0 4px; }

/* pager: one restaurant per page */
.pager { padding: 8px var(--m) 40px; }
.pg-stage { transition: opacity .7s var(--slow), transform .7s var(--slow); min-height: 430px; touch-action: pan-y; }
.pg-stage.out { opacity: 0; transform: translateX(-10px); }
.pg { text-align: center; padding: 16px 0 8px; border-top: 1px solid var(--hair); border-bottom: 1px solid var(--hair); }
.pg-tag { font-size: 14px; font-weight: 500; letter-spacing: .26em; text-transform: uppercase; color: var(--mute); margin: 0 0 4px; }
.pg-tag.on { color: var(--brass); }
.pg-num { font-family: var(--serif); font-size: 56px; line-height: 1; color: var(--brass); margin: 4px 0 12px; font-weight: 400; letter-spacing: .02em; }
.pg-name { overflow-wrap: anywhere; font-family: var(--serif); font-size: clamp(28px, 8.8vw, 34px); line-height: 1.08; font-weight: 500; letter-spacing: -.005em; margin: 0 0 6px; }
.pg-name a { text-decoration: none; }
.pg-branch { font-family: var(--serif); font-style: italic; font-size: 19px; line-height: 1.35; color: var(--ivory); margin: 0 0 8px; }
.pg-zh { font-size: 18px; line-height: 1.5; margin: 0 0 10px; color: var(--ivory); letter-spacing: .08em; }
.pg-meta { font-size: 14px; letter-spacing: .2em; text-transform: uppercase; color: var(--mute); margin: 0; font-weight: 500; }
.pg .orn { margin: 18px auto; }
.pg-why { font-family: var(--serif); font-style: italic; font-size: 20px; line-height: 1.45; margin: 0 0 18px; }
.fits { margin: 0 0 20px; text-align: left; font-size: 16px; line-height: 1.5; }
.fits div { display: grid; grid-template-columns: 84px 1fr; gap: 12px; padding: 8px 0; border-top: 1px solid var(--hair); }
.fits dt { font-size: 14px; letter-spacing: .18em; text-transform: uppercase; color: var(--brass); font-weight: 500; padding-top: 2px; }
.fits dd { margin: 0; }
.fits i { color: var(--mute); }
.pg .btn { margin: 0 0 12px; }
.pg-nav { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; margin: 12px 0 8px; }
.pg-b { min-height: 48px; background: none; border: 0; padding: 0 4px; font-size: 14px; font-weight: 500; letter-spacing: .18em; text-transform: uppercase; color: var(--ivory); cursor: pointer; }
.pg-b:first-child { justify-self: start; }
.pg-b:last-child { justify-self: end; }
.pg-b:disabled { color: var(--hair); cursor: default; }
.pg-count { font-family: var(--serif); font-style: italic; font-size: 18px; color: var(--mute); }
.pg-index { list-style: none; margin: 0; padding: 0; display: flex; justify-content: center; gap: 2px; }
.pg-i { min-width: 46px; min-height: 46px; background: none; border: 0; border-bottom: 1px solid transparent; font-family: var(--serif); font-size: 18px; color: var(--mute); cursor: pointer; }
.pg-i.on { color: var(--brass); }
.pg-i[aria-current="true"] { color: var(--ivory); border-bottom-color: var(--brass); }

/* restaurant */
.r-hero { padding: 28px var(--m) 8px; text-align: center; }
.r-name { overflow-wrap: anywhere; font-family: var(--serif); font-size: clamp(30px, 10.4vw, 40px); line-height: 1.05; font-weight: 500; letter-spacing: -.01em; margin: 0 0 8px; }
.r-why { font-family: var(--serif); font-style: italic; font-size: 23px; line-height: 1.42; margin: 0 0 16px; }
.blk { padding: 16px var(--m) 16px; }
.blk > p { margin: 0 0 16px; }
.ivory { display: block; width: 100%; background: #fbf8f1; color: #000; border: 0; border-radius: 0; padding: 22px 20px; text-align: center; cursor: pointer; margin: 0 0 14px;
  box-shadow: inset 0 0 0 1px #fbf8f1, inset 0 0 0 5px #fbf8f1, inset 0 0 0 6px #1a1a1a; }
.iv-zh { display: block; font-size: 28px; line-height: 1.35; font-weight: 600; }
.iv-sm { display: block; font-size: 17px; line-height: 1.5; margin-top: 8px; color: #222; }
.ivory.big .iv-zh { font-size: 40px; }
.addr-en { text-align: center; margin: 0 0 8px; }
.menu .dishes { list-style: none; padding: 0; margin: 0 0 20px; text-align: center; }
.dishes .dish { padding: 10px 0; }
.d-zh { display: block; font-size: 24px; line-height: 1.4; }
.d-en { display: block; font-family: var(--serif); font-style: italic; font-size: 19px; line-height: 1.4; }
.dish.off .d-zh, .dish.off .d-en { color: var(--mute); }
.dish.off .d-zh { font-size: 20px; }
.dish .lnk { margin-top: 2px; }
.srcs { list-style: none; margin: 0 0 12px; padding: 0; text-align: center; }
.srcs li { margin: 0 0 8px; }
.srcs i { color: var(--mute); }
.bar { position: sticky; bottom: 0; display: grid; grid-template-columns: 1fr 1fr; gap: 10px; padding: 12px var(--m) calc(12px + env(safe-area-inset-bottom)); background: var(--ground); border-top: 1px solid var(--hair); z-index: 5; }
.bar .btn { font-size: 14px; letter-spacing: .14em; padding: 0 8px; }

/* caution: coral, never brass */
.warn { border: 1px solid var(--warn); padding: 12px 14px; margin: 0 0 16px; text-align: left; }
.warn-k { font-size: 14px; font-weight: 500; letter-spacing: .22em; text-transform: uppercase; color: var(--warn); margin: 0 0 4px; }
.warn p:last-child { margin: 0; }

/* order */
.step { display: grid; grid-template-columns: 56px 1fr 56px; align-items: center; }
.st-b { width: 56px; height: 56px; border: 1px solid var(--brass); background: transparent; color: var(--brass); font-size: 26px; line-height: 1; cursor: pointer; border-radius: 50%; }
.st-b:disabled { border-color: var(--hair); color: var(--hair); cursor: default; }
.st-n { text-align: center; margin: 0; }
.st-n span { display: block; font-family: var(--serif); font-size: 64px; line-height: 1; }
.st-n i { display: block; color: var(--mute); font-size: 18px; }
.dts { display: grid; gap: 10px; }
.dt { min-height: 50px; border: 1px solid var(--hair); background: transparent; color: var(--mute); font-size: 14px; letter-spacing: .2em; text-transform: uppercase; font-weight: 500; cursor: pointer; border-radius: 0; }
.dt[aria-pressed="true"] { border-color: var(--brass); color: var(--ground); background: var(--brass); }
.courses { list-style: none; margin: 0 0 16px; padding: 0; text-align: center; }
.course { padding: 8px 0 16px; }
.course + .course { border-top: 1px solid var(--hair); padding-top: 18px; }
.c-zh { font-size: 32px; line-height: 1.3; margin: 0 0 2px; }
.c-en { font-family: var(--serif); font-style: italic; font-size: 21px; margin: 0 0 6px; }
.course .fine { margin: 0 0 8px; }
.outs { list-style: none; padding: 0; margin: 0 0 16px; text-align: center; }
.go { padding-bottom: 40px; }
.go .fine { margin-top: 14px; font-family: var(--serif); font-style: italic; }

/* staff card on the dark stage */
.hd-card .wm { color: var(--mute); }
.stage { padding: 12px 12px 8px; }
.cardx { position: relative; background: #fff; color: #000; display: grid; animation: cardin 1.1s var(--slow) both; }
@keyframes cardin { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: none; } }
.cd-side { grid-area: 1 / 1; padding: 18px 20px 20px; transition: opacity .6s var(--slow); }
.cd-en { opacity: 0; visibility: hidden; font-family: var(--sans); font-size: 17px; line-height: 1.5; }
.cardx.show-en .cd-en { opacity: 1; visibility: visible; }
.cardx.show-en .cd-zh { opacity: 0; visibility: hidden; }
.cd-g { font-size: 21px; line-height: 1.4; margin: 0 0 10px; }
.cd-lines { list-style: none; margin: 0 0 12px; padding: 0; border-top: 2px solid #000; border-bottom: 1px solid #000; }
.cd-lines li { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; font-size: 34px; line-height: 1.3; font-weight: 700; padding: 6px 0; }
.cd-lines li + li { border-top: 1px solid #000; }
.cd-q { font-size: 30px; white-space: nowrap; }
.cd-d { margin: 0 0 8px; }
.cd-t { display: inline-block; font-size: 19px; line-height: 1.4; font-weight: 600; border: 2px solid #000; padding: 0 8px; margin: 0 0 6px; }
.cd-s { font-size: 32px; line-height: 1.3; font-weight: 700; margin: 0 0 6px; }
.cd-p { font-size: 22px; line-height: 1.42; margin: 0 0 6px; }
.cd-c { font-size: 27px; line-height: 1.3; font-weight: 700; margin: 8px 0 0; }
.cd-k { font-size: 14px; font-weight: 500; letter-spacing: .22em; text-transform: uppercase; color: #5b4a2a; margin: 0 0 10px; }
.cd-el { margin: 0 0 12px; padding-left: 20px; }
.turn { margin: 12px 0 0; }
.after { padding-top: 20px; padding-bottom: 40px; }

/* ask panel and taxi overlay: slow fade */
.panel { position: fixed; inset: 0; margin: 0 auto; max-width: 430px; background: var(--raise); z-index: 30; overflow: auto; overscroll-behavior: contain;
  padding: 10px var(--m) calc(40px + env(safe-area-inset-bottom)); opacity: 0; transition: opacity .55s var(--slow); }
.panel.in { opacity: 1; }
.pn-top { display: grid; grid-template-columns: 1fr auto; align-items: center; gap: 8px; border-bottom: 1px solid var(--hair); margin: 0 0 24px; min-height: 52px; }
.pn-top .proto { text-align: left; }
.pn-top .hd-back { justify-self: end; }
.pn-t { font-family: var(--serif); font-size: 34px; line-height: 1.1; text-align: center; margin: 0 0 6px; font-weight: 500; }
.pn-zh { display: block; font-size: 28px; margin-bottom: 6px; font-weight: 400; }
.panel .pg-branch { text-align: center; color: var(--mute); }
.tabs { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin: 18px 0 24px; }
.tab { min-height: 50px; border: 1px solid var(--hair); background: transparent; color: var(--ivory); font-size: 14px; letter-spacing: .14em; text-transform: uppercase; font-weight: 500; cursor: pointer; border-radius: 0; padding: 6px 8px; line-height: 18px; }
.tab[aria-selected="true"] { border-color: var(--brass); color: var(--brass); }
.ans { font-size: 18px; line-height: 1.6; }
.alg { margin: 0 0 16px; }
.alg div { padding: 10px 0; border-top: 1px solid var(--hair); }
.alg dt { font-weight: 500; }
.alg dt i { color: var(--brass); font-weight: 400; margin-left: 6px; }
.alg dd { margin: 2px 0 0; color: var(--ivory); }
.pick { display: block; width: 100%; background: none; border: 0; border-top: 1px solid var(--hair); padding: 14px 0; cursor: pointer; text-align: center; min-height: 56px; }
.taxi { background: var(--ground); }

@media (prefers-reduced-motion: reduce) {
  #app.enter, .cardx { animation: none; }
  .pg-stage, .panel, .cd-side { transition: none; }
}
</style>
</head>
<body>
<main id="app"></main>
<div id="ov"></div>
<script src="data.js"></script>
<script src="v4.js"></script>
</body>
</html>
